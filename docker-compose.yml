services:
  postgres:
    image: postgres:16-alpine
    container_name: localito-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: localito
      POSTGRES_USER: localito
      POSTGRES_PASSWORD: localito
    ports:
      # Solo accesible desde este equipo. Cambie la contraseña si usa una red compartida.
      - "127.0.0.1:5432:5432"
    volumes:
      - localito_pg_data:/var/lib/postgresql/data

volumes:
  localito_pg_data:

